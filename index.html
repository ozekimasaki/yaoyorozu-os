<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>八百万OS — 未開封の日本を、起動する</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Crect x='2' y='4' width='28' height='3' fill='%23c23a2b'/%3E%3Crect x='6' y='7' width='3' height='14' fill='%23c23a2b'/%3E%3Crect x='23' y='7' width='3' height='14' fill='%23c23a2b'/%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0c0b09" />
    <meta name="description" content="ブラウザを筐体にする、八百万の関係性のオペレーティングシステム。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/os.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/wm.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link rel="stylesheet" href="css/irq.css" />
  </head>
  <body>
    <div id="boot">
      <svg class="torii-mark" viewBox="0 0 280 120" aria-hidden="true">
        <rect x="18" y="28" width="244" height="10" fill="#c23a2b" />
        <rect x="10" y="18" width="260" height="10" fill="#c23a2b" />
        <rect x="46" y="28" width="12" height="84" fill="#c23a2b" />
        <rect x="222" y="28" width="12" height="84" fill="#c23a2b" />
        <rect x="86" y="38" width="8" height="28" fill="#c9a227" />
        <rect x="186" y="38" width="8" height="28" fill="#c9a227" />
      </svg>
      <h1 class="boot-title">八百万OS</h1>
      <div class="boot-sub">YAOYOROZU OPERATING SYSTEM</div>
      <div id="boot-log" aria-live="polite"></div>
      <div class="boot-actions" id="boot-ready" hidden>
        <button class="btn primary" id="boot-start" type="button">誓約して起動する</button>
        <button class="btn" id="boot-skip" type="button">名を預けずに急ぐ</button>
      </div>
    </div>

    <div id="desktop" tabindex="-1">
      <canvas id="kami-field"></canvas>
      <div class="desktop-veil"></div>
      <div id="norito-veil" aria-hidden="true"></div>
      <div id="ofuda-stack" aria-live="polite"></div>
      <header class="menubar">
        <div class="brand" title="鳥居を開く">八百万OS</div>
        <div class="menubar-meta" id="menubar-meta" title="氏子課">oncall=… · kernel=…</div>
        <div class="clock" id="clock" title="祭暦"></div>
      </header>
      <div id="desktop-icons"></div>
      <div id="window-layer"></div>
      <div class="hint">/ 鳥居 · ; 窓 · ' 空間 · , 席 · . 並べ · n 告げ · k 柏手 · m 間 · Ctrl+W 閉じる</div>
      <footer class="taskbar" id="taskbar">
        <span class="pill" id="space-pill">kernel: 47</span>
        <span class="pill" id="kami-pill">kami: 8,000,000+</span>
        <span class="pill" id="logout-pill">logout: 遷宮まで無効</span>
        <span class="pill" id="ma-pill">status: 間</span>
        <span class="pill" id="oshi-pill">告げ</span>
        <div class="task-apps"></div>
      </footer>
    </div>

    <div id="torii-gate">
      <p class="torii-head">鳥居</p>
      <p class="muted">くぐると起動する。戻る権利がある。Esc で戻る。</p>
      <input id="torii-search" type="search" placeholder="アプリ、県、神、最近の札" autocomplete="off" />
      <div id="torii-list"></div>
    </div>

    <div id="kashiwa-stage">
      <p class="torii-head">柏手</p>
      <p class="muted">左手と右手。二要素認証。引きではない。</p>
      <div class="kashiwa-hands">
        <button type="button" class="hand" data-hand="left">左手</button>
        <button type="button" class="hand" data-hand="right">右手</button>
      </div>
      <div id="kashiwa-log"></div>
      <div id="kashiwa-result"></div>
    </div>

    <div id="win-switcher"></div>
    <div id="space-switcher"></div>
    <div id="desk-icon-menu" hidden>
      <button type="button" data-act="open">くぐる</button>
      <button type="button" data-act="rename">改名</button>
      <button type="button" data-act="copy">写す</button>
      <button type="button" data-act="cut">切る</button>
      <button type="button" data-act="paste">貼る</button>
      <button type="button" data-act="muen">無縁へ</button>
    </div>
    <div id="eaves-menu" hidden>
      <button type="button" data-act="torii">鳥居</button>
      <button type="button" data-act="tile">窓を並べる</button>
      <button type="button" data-act="tidy">札を揃える</button>
      <button type="button" data-act="paste">貼る</button>
      <button type="button" data-act="ofuda">新しい札</button>
      <button type="button" data-act="box">新しい匣</button>
      <button type="button" data-act="cal">祭暦</button>
      <button type="button" data-act="clip">控え</button>
      <button type="button" data-act="sys">機械</button>
      <button type="button" data-act="muen">無縁</button>
      <button type="button" data-act="ma">間</button>
    </div>
    <div id="oshi-list" hidden>
      <p class="muted">お告げ</p>
      <div id="oshi-log" class="term-out"></div>
      <button class="btn" type="button" id="oshi-clear">札を下ろす</button>
    </div>
    <div id="ujiko-drawer" hidden>
      <p class="muted">氏子課</p>
      <div id="ujiko-log" class="term-out"></div>
      <button class="btn" type="button" id="ujiko-open-dmesg">dmesg を開く</button>
    </div>
    <div id="ma-lock">
      <p class="torii-head">間</p>
      <p class="muted">ログアウトではない。機械は眠っている。柏手か、下の文で起こす。</p>
      <button class="btn primary" type="button" id="ma-wake">間を終える</button>
    </div>
    <div id="irq-layer"></div>

    <script src="data/prefectures.js"></script>
    <script src="data/kami.js"></script>
    <script src="data/constitution.js"></script>
    <script src="data/protocols.js"></script>
    <script src="data/manifesto.js"></script>
    <script src="data/century.js"></script>
    <script src="data/irq.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    </script>
  </body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p public-dist
          cp index.html 404.html .nojekyll public-dist/
          cp -r css js data svg icons public-dist/
          cp manifest.webmanifest sw.js public-dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist
      - id: deployment
        uses: actions/deploy-pages@v4
